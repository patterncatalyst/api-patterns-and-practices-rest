# Ch13 soft-delete & GDPR purge anchor extension. Bind to all interfaces so the container's
# published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.application.name=shipping-quarkus-ch13

# Omit null-valued optional fields (quote, requestedPickup, updatedAt,
# Problem.detail/instance) from JSON output instead of emitting `null` —
# the shared schema has additionalProperties:false and does not declare
# those fields as nullable, only as optional.
quarkus.jackson.serialization-inclusion=non-null
