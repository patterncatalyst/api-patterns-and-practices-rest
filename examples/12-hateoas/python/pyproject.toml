[project]
name = "shipping-python-ch12"
version = "1.0.0"
description = "Ch12 HATEOAS — FastAPI side (state-dependent _links on the shipping/cargo Booking)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
