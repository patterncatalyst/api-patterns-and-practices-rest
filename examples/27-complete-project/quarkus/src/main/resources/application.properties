# Ch27 complete-project anchor. Bind to all interfaces so the container's
# published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.application.name=shipping-quarkus-ch27

# Omit null-valued optional fields from JSON output instead of emitting
# `null` — the shared schema has additionalProperties:false and does not
# declare those fields as nullable, only as optional.
quarkus.jackson.serialization-inclusion=non-null

# ---------------------------------------------------------------------------
# Kafka (background event-streaming path, Ch21) — SmallRye Reactive
# Messaging. `kafka` is the compose service name for the single-node KRaft
# broker.
# ---------------------------------------------------------------------------
kafka.bootstrap.servers=kafka:9092

mp.messaging.outgoing.booking-events.connector=smallrye-kafka
mp.messaging.outgoing.booking-events.topic=shipping.bookings.lifecycle
mp.messaging.outgoing.booking-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.booking-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
