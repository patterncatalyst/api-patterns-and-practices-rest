[project]
name = "shipping-python-ch18"
version = "1.0.0"
description = "Ch18 back-end I/O concurrency anchor — FastAPI side."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
