<text x="470.0" y="575" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">Reactive/virtual threads and the asyncio event loop scale by never parking an OS thread on I/O; blocking models scale only as far as the thread pool, then requests queue or fail.</text>
