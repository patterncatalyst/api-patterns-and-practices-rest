# appendix-a-secret — DEV-ONLY, PLAINTEXT-IN-GIT Secret, same scope as
# examples/26-minikube/k8s/base/secret.yaml. Neither booking service reads
# this today; it demonstrates the secretKeyRef/envFrom wiring distinct from
# a ConfigMap (base64-at-rest, separately RBAC-able), not a real credential.
#
# PRODUCTION: a SealedSecret (bitnami-labs/sealed-secrets) or an
# ExternalSecret (external-secrets.io) — never a plaintext Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: appendix-a-secret
  labels:
    {{- include "appendix-a.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secret | nindent 2 }}
