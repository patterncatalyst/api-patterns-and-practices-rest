<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="25" width="900" height="150" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="45" font-size="12" font-weight="700" fill="#1d1d1d">BUILD TIME — once, ahead of deployment</text>
<rect x="20" y="205" width="900" height="230" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="225" font-size="12" font-weight="700" fill="#1d1d1d">RUNTIME — per request</text>
<rect x="50" y="75" width="190" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="145.0" y="103.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">source</text>
<text x="145.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">@Path / @GET / @RestQuery</text>
<rect x="300" y="75" width="220" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="410.0" y="103.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Quarkus annotation processor</text>
<text x="410.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">resolves bindings at compile time</text>
<rect x="590" y="75" width="290" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="735.0" y="103.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">generated metadata</text>
<text x="735.0" y="120.0" font-size="11.5" fill="#555555" text-anchor="middle">zero reflection at runtime</text>
<rect x="40" y="245" width="150" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="278.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">HTTP client</text>
<rect x="230" y="245" width="170" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="315.0" y="270.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Vert.x</text>
<text x="315.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">event loop</text>
<rect x="440" y="245" width="220" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="550.0" y="270.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">zero-reflection binding</text>
<text x="550.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">@RestHeader / @RestQuery</text>
<rect x="700" y="245" width="180" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="790.0" y="270.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">handler</text>
<text x="790.0" y="287.5" font-size="11.5" fill="#555555" text-anchor="middle">business logic</text>
<rect x="440" y="345" width="440" height="55" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="660.0" y="370.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">reactive streaming response</text>
<text x="660.0" y="387.5" font-size="11.5" fill="#555555" text-anchor="middle">NDJSON / large JSON back to the client</text>
<path d="M240,105 L300,105" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M520,105 L590,105" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M190,272 L230,272" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M400,272 L440,272" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M660,272 L700,272" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M790,300 L660,345" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M440,372 L115,300" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="283.5" y="330.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">streamed back</text>
<text x="283.5" y="330.0" font-size="11" fill="#b8650a" text-anchor="middle">streamed back</text>
<path d="M735,135 L550,245" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="470.0" y="548" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">Traditional reflective frameworks resolve this binding on every request at runtime; Quarkus resolves it once at build time, so the event loop never pays a reflection tax.</text>
</svg>