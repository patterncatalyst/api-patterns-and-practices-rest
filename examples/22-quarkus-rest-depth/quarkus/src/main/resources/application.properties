# Ch22 Quarkus REST in depth anchor. Bind to all interfaces so the
# container's published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.application.name=shipping-quarkus-ch22

# Omit null-valued optional fields (BookingEvent.origin/destination) from
# JSON output instead of emitting `null` — the shared schema has
# additionalProperties:false and does not declare those fields as nullable,
# only as optional.
quarkus.jackson.serialization-inclusion=non-null
