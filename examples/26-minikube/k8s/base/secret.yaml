# booking-secret — DEV-ONLY, PLAINTEXT-IN-GIT Secret, deliberately scoped
# the same way as
# ~/Dev/modernizing-enterprise-applications/deploy/k8s/base/app-secret.yaml:
# demo value only, never how real credentials reach a cluster.
#
# Neither Ch25 booking service has a real credential-consuming dependency
# today (no database, no upstream auth — both run an in-memory store; see
# examples/25-local-with-docker-compose/{quarkus,python}). This chapter's
# subject is the Kubernetes *mechanism* for injecting sensitive config
# (envFrom: secretRef, distinct from a ConfigMap only in how the API server
# stores/guards the value), contrasted with compose's plaintext
# `environment:` block — so this Secret carries one representative demo
# value (a stand-in upstream pricing-provider API key) wired into both
# Deployments' env via secretKeyRef. Neither app reads it today; it is
# harmless to both (same "harmless when a service has no code path for a
# key" discipline the mea repo's app-config.yaml documents), and proves the
# wiring: `kubectl exec ... -- env | grep PRICING_PROVIDER_API_KEY` shows
# the decoded value reached the container, never the cluster's etcd/API
# audit log in plaintext the way compose's `environment:` line would.
#
# PRODUCTION: replace with a SealedSecret (bitnami-labs/sealed-secrets) or
# an ExternalSecret (external-secrets.io, synced from Vault/Bitwarden) —
# out of scope for this manifests-only chapter.
apiVersion: v1
kind: Secret
metadata:
  name: booking-secret
  namespace: ch26-booking
  labels:
    app.kubernetes.io/part-of: ch26-booking
type: Opaque
stringData:
  PRICING_PROVIDER_API_KEY: "demo-pricing-key-ch26-dev-only"
