# python-booking — the SAME image as examples/25-local-with-docker-compose/
# python (built from its Containerfile, not a third copy of the app).
#
# Health: the FastAPI app exposes a single `/health` endpoint (no separate
# started/ready/live split — see examples/25-local-with-docker-compose/
# python/app/main.py), so all three probes below target the same path,
# unlike the Quarkus side's three distinct /q/health/* endpoints — a
# concrete, visible contrast in what "probes" demonstrate per app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-booking
  namespace: ch26-booking
  labels:
    app.kubernetes.io/name: python-booking
    app.kubernetes.io/part-of: ch26-booking
    app.kubernetes.io/component: booking-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-booking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-booking
        app.kubernetes.io/part-of: ch26-booking
        app.kubernetes.io/component: booking-api
    spec:
      containers:
        - name: python-booking
          image: booking/python:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 400m
              memory: 384Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: ch26-booking
  labels:
    app.kubernetes.io/name: python-booking
    app.kubernetes.io/part-of: ch26-booking
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: python-booking
  ports:
    - name: http
      port: 8000
      targetPort: http
