# Ch25 local-with-docker-compose anchor. Bind to all interfaces so the
# container's published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# quarkus-opentelemetry maps this to the resource attribute `service.name`
# when no explicit `quarkus.otel.resource.attributes` service.name is set —
# this is the name verify.sh looks for on the exported span's resource.
quarkus.application.name=shipping-quarkus

# Omit null-valued optional fields (quote, requestedPickup, updatedAt,
# Problem.detail/instance) from JSON output instead of emitting `null` —
# the shared schema has additionalProperties:false and does not declare
# those fields as nullable, only as optional.
quarkus.jackson.serialization-inclusion=non-null

# ---------------------------------------------------------------------------
# OpenTelemetry — export every trace to the local LGTM collector over
# OTLP/gRPC (port 4317). `always_on` is deliberate: this chapter's
# verify.sh asserts a SPECIFIC, fixed trace id landed in Tempo, so sampling
# must never drop it.
# ---------------------------------------------------------------------------
quarkus.otel.exporter.otlp.endpoint=http://lgtm:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=always_on

# Quarkus REST auto-instruments every JAX-RS endpoint (HTTP server spans,
# `http.route`/`http.request.method` attributes) and honors an inbound W3C
# `traceparent` header via the default tracecontext propagator — no extra
# config needed for a request to CONTINUE an existing trace id rather than
# starting a new one.
