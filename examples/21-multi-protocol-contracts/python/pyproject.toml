[project]
name = "shipping-python-ch21"
version = "1.0.0"
description = "Ch21 multi-protocol-contracts anchor — FastAPI side (REST + Kafka/CloudEvents)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "confluent-kafka>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
