# Ch19 HTTP/2 & HTTP/3 anchor. Bind to all interfaces so the container's
# published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.application.name=shipping-quarkus-ch19

# HTTP/2 is ON by default in Quarkus's Vert.x HTTP layer, including
# cleartext h2c (prior-knowledge, no TLS/ALPN) when the connection has no
# TLS context — which is exactly this compose stack (no certs configured).
# This line is kept explicit (rather than relying on the default) so the
# chapter's whole point — "this server deliberately speaks HTTP/2" — is
# visible in config, not just in Quarkus's defaults. See README.md for the
# curl --http2-prior-knowledge verification and the induced-failure drill
# (flip this to `false` and watch verify.sh's h2 assertion fail).
quarkus.http.http2=true

# Omit null-valued optional fields from JSON output instead of emitting
# `null` (consistent with the rest of the repo's examples).
quarkus.jackson.serialization-inclusion=non-null
