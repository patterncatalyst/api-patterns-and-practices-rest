<text x="515.0" y="288.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">stream 1: independent, interleaved frames</text>
<rect x="290" y="306" width="450" height="26" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="515.0" y="324.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">stream 2: independent, interleaved frames</text>
<rect x="290" y="342" width="450" height="26" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="515.0" y="360.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">stream 3: independent, interleaved frames</text>
<rect x="40" y="470" width="140" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="110.0" y="493.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="110.0" y="510.0" font-size="11.5" fill="#555555" text-anchor="middle">roams networks</text>
<rect x="760" y="470" width="140" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="830.0" y="500.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server</text>
<rect x="290" y="440" width="450" height="26" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="515.0" y="458.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">stream 1: no TCP, a lost packet blocks only this stream</text>
<rect x="290" y="476" width="450" height="26" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="515.0" y="494.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">stream 2: no TCP, a lost packet blocks only this stream</text>
