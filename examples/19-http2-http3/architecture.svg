<path d="M740,525 L760,495" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="470.0" y="625" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">HTTP/2 fixes application-level head-of-line blocking but one lost TCP segment still stalls every stream; HTTP/3&#x27;s independent QUIC streams don&#x27;t share that fate. HTTP/3 coverage is tier-gated in CI (skipped unless the runner has QUIC support).</text>
