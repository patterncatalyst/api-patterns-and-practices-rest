<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="30" width="900" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="50" font-size="12" font-weight="700" fill="#1d1d1d">HTTP/1.1: serial, head-of-line blocked</text>
<rect x="20" y="220" width="900" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="240" font-size="12" font-weight="700" fill="#1d1d1d">HTTP/2: multiplexed streams, HPACK, over one TCP connection</text>
<rect x="20" y="410" width="900" height="170" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="430" font-size="12" font-weight="700" fill="#1d1d1d">HTTP/3: independent streams over QUIC/UDP, QPACK, 0-RTT, connection migration</text>
