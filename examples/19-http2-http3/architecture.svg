<text x="830.0" y="310.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server</text>
<rect x="250" y="235" width="500" height="24" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="500.0" y="252.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">one TCP connection</text>
