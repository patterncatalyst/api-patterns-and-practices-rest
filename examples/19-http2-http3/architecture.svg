<text x="110.0" y="120.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<rect x="760" y="90" width="140" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="830.0" y="120.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Server</text>
