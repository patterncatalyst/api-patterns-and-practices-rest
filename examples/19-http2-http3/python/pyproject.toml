[project]
name = "shipping-python-ch19"
version = "1.0.0"
description = "Ch19 REST over HTTP/2 & HTTP/3 anchor — FastAPI side, served by Hypercorn."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    # uvicorn does NOT speak HTTP/2 cleartext (h2c) — it's an HTTP/1.1-only
    # ASGI server (TLS+ALPN h2 support exists for some uvicorn builds, but
    # not cleartext). Hypercorn is an ASGI server that negotiates HTTP/2 over
    # a plain cleartext bind out of the box (prior-knowledge h2c, no
    # TLS/ALPN needed) — see README.md and app/main.py.
    "hypercorn>=0.17",
    # Hypercorn's HTTP/2 support is provided by the `h2` package; it's a
    # transitive dependency of hypercorn but pinned here explicitly so a
    # missing h2 install fails fast at `uv sync` time instead of silently
    # falling back to HTTP/1.1 at request time.
    "h2>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
