# Ch20 OpenAPI-in-depth anchor. Bind to all interfaces so the container's
# published port actually reaches the process.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

quarkus.application.name=shipping-quarkus-ch20

# Omit null-valued optional fields from JSON output instead of emitting
# `null` — same convention as every other example in this repo.
quarkus.jackson.serialization-inclusion=non-null

# Serve the hand-authored META-INF/openapi.yaml VERBATIM at
# /q/openapi?format=json instead of merging it with annotation-scanned
# JAX-RS resources. This chapter's whole point is OpenAPI-3.1-era
# constructs (a `type` array nullable, a top-level `webhooks` section) that
# MicroProfile OpenAPI's annotation model does not expose a clean way to
# author — so the document is static, while BookingResource below still
# serves real, working HTTP endpoints independent of this flag. See
# README.md for the "drift probe" that flips this back on.
mp.openapi.scan.disable=true
