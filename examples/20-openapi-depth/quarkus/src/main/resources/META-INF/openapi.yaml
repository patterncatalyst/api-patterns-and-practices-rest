openapi: 3.1.0
info:
  title: Ch20 OpenAPI-in-depth — Shipping API (Quarkus)
  version: "1.0.0"
  description: >
    Hand-authored static OpenAPI 3.1 document, served verbatim via
    mp.openapi.scan.disable=true (see application.properties and
    README.md). It demonstrates two OpenAPI-3.1 / full-JSON-Schema-alignment
    capabilities the shared contract (contracts/openapi/shipping-api.yaml,
    still OpenAPI 3.0) does not yet use: (1) a `type` array for a nullable
    property (`cancellationReason` on Booking, below) instead of OAS-3.0's
    `nullable: true` keyword, and (2) a top-level `webhooks` map describing
    an outbound notification the server POSTs to a registered callback.
    MicroProfile OpenAPI's annotation model has no clean way to author
    either construct today, so this document is static rather than
    generated from @Path-annotated resources — BookingResource.java still
    serves real, working HTTP endpoints independent of this file.
servers:
  - url: http://localhost:8100
    description: This compose stack
paths:
  /bookings:
    post:
      operationId: createBooking
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid booking request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /bookings/{id}:
    get:
      operationId: getBooking
      summary: Fetch a booking by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Booking not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
webhooks:
  bookingStatusChanged:
    post:
      summary: >
        Notify a registered callback URL when a booking's status changes.
        Documentation-only in this teaching example — the server never
        actually issues this call — but it is a REAL top-level OpenAPI 3.1
        `webhooks` entry, exactly like one a real booking-confirmation or
        shipment-tracking integration would declare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingEvent'
      responses:
        '200':
          description: Callback endpoint acknowledged the notification
components:
  schemas:
    Location:
      type: object
      properties:
        unLocode:
          type: string
          pattern: '^[A-Z]{2}[A-Z0-9]{3}$'
        name:
          type: string
        country:
          type: string
          pattern: '^[A-Z]{2}$'
      required: [unLocode]
      additionalProperties: false
    Dimensions:
      type: object
      properties:
        weightKg:
          type: number
          exclusiveMinimum: 0
        volumeM3:
          type: number
          exclusiveMinimum: 0
      required: [weightKg]
      additionalProperties: false
    CargoType:
      type: string
      enum: [GENERAL, REFRIGERATED, HAZARDOUS, OVERSIZED, LIQUID_BULK]
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, IN_TRANSIT, DELIVERED, CANCELLED]
    Cargo:
      type: object
      properties:
        id:
          type: string
          pattern: '^crg_[0-9A-HJKMNP-TV-Z]{26}$'
        description:
          type: string
          maxLength: 280
        type:
          $ref: '#/components/schemas/CargoType'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        hazardous:
          type: boolean
      required: [description, type, dimensions]
      additionalProperties: false
    CargoRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 280
        type:
          $ref: '#/components/schemas/CargoType'
        dimensions:
          $ref: '#/components/schemas/Dimensions'
        hazardous:
          type: boolean
      required: [description, type, dimensions]
      additionalProperties: false
    Money:
      type: object
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
      required: [currency, amount]
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      required: [title, status]
    # Mirrors #/$defs/Booking in contracts/schemas/shipping.schema.json —
    # verify.sh's drift check compares the `required` SET here against that
    # file, so a deliberate edit that adds/removes a required field here
    # (without touching the contract, or vice versa) fails the gate.
    # `cancellationReason` is new in THIS document only (optional, not in
    # `required`) to demonstrate an OpenAPI-3.1 `type` array nullable —
    # flip it to `nullable: true` (OAS-3.0 style) and verify.sh's "nullable
    # construct present" check still passes; delete the property entirely
    # and watch it fail. See README.md.
    Booking:
      type: object
      properties:
        id:
          type: string
          pattern: '^bkg_[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          $ref: '#/components/schemas/BookingStatus'
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        cargo:
          type: array
          items:
            $ref: '#/components/schemas/Cargo'
          minItems: 1
        quote:
          $ref: '#/components/schemas/Money'
        requestedPickup:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancellationReason:
          description: >
            Null until the booking is cancelled. Declared as an OpenAPI 3.1
            JSON Schema `type` ARRAY (["string", "null"]) rather than an
            OAS-3.0 `nullable: true` flag — full JSON Schema alignment is
            one of this chapter's two headline OpenAPI-3.1 capabilities.
          type: [string, 'null']
      required: [id, status, origin, destination, cargo, createdAt]
      additionalProperties: false
    BookingRequest:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        cargo:
          type: array
          items:
            $ref: '#/components/schemas/CargoRequest'
          minItems: 1
        requestedPickup:
          type: string
          format: date
      required: [origin, destination, cargo]
      additionalProperties: false
    BookingEvent:
      type: object
      description: >
        Domain-event payload for the `bookingStatusChanged` webhook above —
        reuses the same component types as the synchronous API, mirroring
        `#/$defs/BookingEvent` in the shared contract schema.
      properties:
        bookingId:
          type: string
          pattern: '^bkg_[0-9A-HJKMNP-TV-Z]{26}$'
        status:
          $ref: '#/components/schemas/BookingStatus'
        previousStatus:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
      required: [bookingId, status, occurredAt]
      additionalProperties: false
