[project]
name = "shipping-python"
version = "1.0.0"
description = "Ch0 boot skeleton — FastAPI side (shipping/cargo domain)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
