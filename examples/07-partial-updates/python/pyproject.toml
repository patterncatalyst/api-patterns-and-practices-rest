[project]
name = "shipping-python-ch07"
version = "1.0.0"
description = "Ch7 partial-updates — FastAPI side (shipping/cargo domain)."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
