<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="10" y="430" width="880" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="22" y="450" font-size="12" font-weight="700" fill="#1d1d1d">Key status codes</text>
<rect x="310" y="20" width="280" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="450.0" y="53.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client request</text>
<text x="450.0" y="70.0" font-size="11.5" fill="#555555" text-anchor="middle">GET /bookings/42</text>
<text x="450.0" y="85.0" font-size="11.5" fill="#555555" text-anchor="middle">Accept: application/json</text>
<text x="450.0" y="100.0" font-size="11.5" fill="#555555" text-anchor="middle">Content-Type: application/json</text>
<rect x="330" y="160" width="240" height="80" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="198.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Server</text>
<text x="450.0" y="215.0" font-size="11.5" fill="#dddddd" text-anchor="middle">negotiate representation</text>
<rect x="40" y="290" width="250" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="165.0" y="328.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Accept satisfiable</text>
<text x="165.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">200 OK</text>
<text x="165.0" y="360.0" font-size="11.5" fill="#555555" text-anchor="middle">Content-Type: negotiated media type</text>
<text x="165.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">body = representation</text>
<rect x="330" y="290" width="240" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="450.0" y="335.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Accept not satisfiable</text>
<text x="450.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">406 Not Acceptable</text>
<text x="450.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">no representation the server offers matches</text>
<rect x="610" y="290" width="250" height="110" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="735.0" y="335.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Content-Type unsupported</text>
<text x="735.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">415 Unsupported Media Type</text>
<text x="735.0" y="367.5" font-size="11.5" fill="#555555" text-anchor="middle">server can&#x27;t parse the request body</text>
<rect x="25" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="92.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">200 OK</text>
<text x="92.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">representation returned</text>
<rect x="168" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="235.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">201 Created</text>
<text x="235.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">Location header; resource created</text>
<rect x="311" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="378.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">204 No Content</text>
<text x="378.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">success, empty body</text>
<rect x="454" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="521.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">400 Bad Request</text>
<text x="521.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">malformed request</text>
<rect x="597" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="664.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">404 Not Found</text>
<text x="664.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">no such resource</text>
<rect x="740" y="470" width="135" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="807.5" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">409 Conflict</text>
<text x="807.5" y="535.0" font-size="11.5" fill="#555555" text-anchor="middle">state conflict (e.g. version)</text>
<path d="M450,120 L450,160" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="456.0" y="134.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">negotiate</text>
<text x="456.0" y="134.0" font-size="11" fill="#555" text-anchor="middle">negotiate</text>
<path d="M400,240 L165,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="288.5" y="259.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">match</text>
<text x="288.5" y="259.0" font-size="11" fill="#555" text-anchor="middle">match</text>
<path d="M450,240 L450,290" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="456.0" y="259.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no match</text>
<text x="456.0" y="259.0" font-size="11" fill="#b8650a" text-anchor="middle">no match</text>
<path d="M500,240 L735,290" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<text x="623.5" y="259.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">unsupported</text>
<text x="623.5" y="259.0" font-size="11" fill="#b8650a" text-anchor="middle">unsupported</text>
