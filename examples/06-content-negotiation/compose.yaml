# Ch6 content negotiation & status codes — compose topology for the
# shipping/cargo Booking resource, extended from the Ch4 contract-first
# anchor.
#
# Host ports are deliberately UNIQUE across examples (8086/8006, not
# 8080/8000) so this stack can run alongside ch04/ch05 without a port
# collision. Default `docker compose up` brings up: quarkus, python. Both
# implement the identical contract from contracts/openapi/shipping-api.yaml +
# contracts/schemas/shipping.schema.json against an in-memory store — no
# Postgres needed for this example. The LGTM observability stack is opt-in
# (`--profile observability`) so CI and a first boot stay fast; neither app
# ships telemetry yet.
#
# Usage:
#   docker compose up --build                          # app stack only
#   docker compose --profile observability up --build  # + Grafana LGTM

services:
  quarkus:
    build:
      context: ./quarkus
      dockerfile: Containerfile
    container_name: ch06-shipping-quarkus
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/q/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  python:
    build:
      context: ./python
      dockerfile: Containerfile
    container_name: ch06-shipping-python
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ─── Observability (opt-in) ────────────────────────────────────────────
  # `docker compose --profile observability up` to include. Off by default
  # so CI's examples job (and a first boot) stay fast.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.36.0
    container_name: ch06-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus / Mimir query
      - "3100:3100" # Loki
      - "3200:3200" # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
