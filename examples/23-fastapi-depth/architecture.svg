<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="25" width="900" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="45" font-size="12" font-weight="700" fill="#1d1d1d">ASGI server</text>
<rect x="20" y="160" width="900" height="180" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="32" y="180" font-size="12" font-weight="700" fill="#1d1d1d">the key decision — where does the handler run?</text>
<rect x="20" y="365" width="900" height="150" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="385" font-size="12" font-weight="700" fill="#1d1d1d">response handling</text>
<rect x="40" y="60" width="150" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="115.0" y="90.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">HTTP client</text>
<rect x="240" y="60" width="220" height="50" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="350.0" y="83.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Uvicorn / Hypercorn</text>
<text x="350.0" y="100.0" font-size="11.5" fill="#555555" text-anchor="middle">ASGI server</text>
<rect x="520" y="60" width="200" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="620.0" y="90.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">single event loop</text>
<rect x="80" y="200" width="340" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="225.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">async def handler</text>
<text x="250.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">runs ON the event loop</text>
<text x="250.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">ideal for awaitable I/O (DB, HTTP, Kafka)</text>
<rect x="500" y="200" width="340" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="670.0" y="225.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">def (sync) handler</text>
<text x="670.0" y="242.5" font-size="11.5" fill="#555555" text-anchor="middle">offloaded to a threadpool</text>
<text x="670.0" y="257.5" font-size="11.5" fill="#555555" text-anchor="middle">so it never blocks the loop</text>
<rect x="500" y="285" width="340" height="40" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="670.0" y="310.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">threadpool executor</text>
<rect x="60" y="405" width="380" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="435.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">StreamingResponse / SSE</text>
<text x="250.0" y="452.5" font-size="11.5" fill="#555555" text-anchor="middle">streams chunks back on the event loop</text>
<text x="250.0" y="467.5" font-size="11.5" fill="#555555" text-anchor="middle">without buffering the whole payload</text>
<rect x="500" y="405" width="340" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="670.0" y="435.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">BackgroundTasks</text>
<text x="670.0" y="452.5" font-size="11.5" fill="#555555" text-anchor="middle">scheduled to run AFTER</text>
<text x="670.0" y="467.5" font-size="11.5" fill="#555555" text-anchor="middle">the response has been sent</text>
<path d="M190,85 L240,85" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M460,85 L520,85" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M620,110 L250,200" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M620,110 L670,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M670,270 L670,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M250,270 L250,405" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,325 L670,405" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="470.0" y="608" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">Under the GIL, threadpool-offloaded sync handlers still contend for the interpreter lock during CPU-bound work; only I/O-bound release points actually parallelize. Free-threaded (no-GIL) Python builds change this trade-off but are not yet the default.</text>
</svg>