[project]
name = "shipping-python-ch23"
version = "1.0.0"
description = "Ch23 FastAPI in depth — ASGI streaming (SSE), BackgroundTasks, async vs. threadpool."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
