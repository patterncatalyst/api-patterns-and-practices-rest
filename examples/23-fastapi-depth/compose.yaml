# Ch23 FastAPI in depth — compose topology.
#
# Single-stack on purpose: Ch23 is the per-framework deep-dive on FastAPI/
# ASGI depth — StreamingResponse/SSE, BackgroundTasks, and the async vs.
# threadpool execution story — so there is no quarkus/ counterpart here
# (unlike the cross-stack chapters; see Ch22 for the Quarkus-side depth
# chapter). One service, one focused app. Port 8022 is deliberately UNIQUE
# across the repo's examples so this stack can run alongside any other
# chapter's without a port clash. The LGTM observability stack is opt-in
# (`--profile observability`) so CI and a first boot stay fast; the app
# doesn't ship telemetry yet.
#
# Usage:
#   docker compose up --build                          # app stack only
#   docker compose --profile observability up --build  # + Grafana LGTM

services:
  python:
    build:
      context: ./python
      dockerfile: Containerfile
    container_name: ch23-fastapi-python
    ports:
      - "8022:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ─── Observability (opt-in) ────────────────────────────────────────────
  # `docker compose --profile observability up` to include. Off by default
  # so CI's examples job (and a first boot) stay fast.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.36.0
    container_name: ch23-fastapi-depth-lgtm
    profiles: ["observability"]
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus / Mimir query
      - "3100:3100" # Loki
      - "3200:3200" # Tempo
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
