name: contracts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Lint & validate contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint OpenAPI + AsyncAPI (Spectral)
        run: >-
          npx --yes @stoplight/spectral-cli@6 lint
          --ruleset contracts/.spectral.yaml
          --fail-severity=error
          contracts/openapi/*.yaml contracts/asyncapi/*.yaml

      - name: Validate OpenAPI structure + refs (Redocly)
        run: >-
          npx --yes @redocly/cli@1 lint
          --config contracts/redocly.yaml
          contracts/openapi/shipping-api.yaml contracts/openapi/shipping-api-v1.yaml

      - name: Validate shared schema + CloudEvents data (jsonschema)
        run: |
          python -m pip install --quiet 'jsonschema>=4.18' referencing
          python -I scripts/validate_schemas.py

  site:
    name: Validate site & build Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Static validation (front matter, diagrams, coverage)
        run: python -I scripts/validate.py

      - name: Word-count gate (draft/verified chapters)
        run: GATE=1 bash scripts/wordcount.sh

      - name: Build Jekyll
        run: bundle exec jekyll build --trace

  k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install helm
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Validate minikube kustomize manifests (strict)
        run: |
          if [ -d examples/26-minikube/k8s ]; then
            kubectl kustomize examples/26-minikube/k8s | kubeconform -strict -summary
          else
            echo "examples/26-minikube/k8s not present yet"
          fi

      - name: Validate OpenShift/CRC Helm chart
        run: |
          if [ -d examples/99-appendix-a-openshift-crc/helm ]; then
            helm lint examples/99-appendix-a-openshift-crc/helm
            helm template examples/99-appendix-a-openshift-crc/helm | kubeconform -ignore-missing-schemas -summary
          else
            echo "examples/99-appendix-a-openshift-crc/helm not present yet"
          fi

  discover-examples:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.find.outputs.examples }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        name: Build the example matrix from examples/*/verify.sh
        run: |
          shopt -s nullglob
          names=()
          for s in examples/*/verify.sh; do
            names+=("$(basename "$(dirname "$s")")")
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "examples=[]" >> "$GITHUB_OUTPUT"
            echo "No examples/*/verify.sh yet."
            exit 0
          fi
          json=$(printf '%s\n' "${names[@]}" | sort | jq -R . | jq -cs .)
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "examples=$json" >> "$GITHUB_OUTPUT"
          echo "Matrix: $json"

  examples:
    name: "verify: ${{ matrix.example }}"
    needs: discover-examples
    if: needs.discover-examples.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.discover-examples.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify ${{ matrix.example }} (payload semantics vs contract, both stacks)
        run: bash "examples/${{ matrix.example }}/verify.sh"

  examples-summary:
    name: Verify stacks against the contract
    needs: [discover-examples, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the example matrix result
        run: |
          result="${{ needs.examples.result }}"
          echo "examples matrix result: $result"
          # 'skipped' is OK only when there are no examples; otherwise require success.
          if [ "${{ needs.discover-examples.outputs.any }}" = "true" ] && [ "$result" != "success" ]; then
            echo "One or more example verify.sh jobs failed."
            exit 1
          fi
          echo "All example verifications passed (or none to run)."
