<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600"><defs><marker id="_arrow_danger_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_platform_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1300" height="600" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Quarkus REST: build-time binding, not runtime reflection</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Resolve @RestHeader / @RestQuery / @RestPath once, at build (not on every request).</text><rect x="40" y="120" width="1220" height="150" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="64" y="150" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B71C1C" text-anchor="start">Classic JAX-RS: resolved by reflection, every request</text><rect x="70" y="175" width="230" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="185.0" y="215.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Request</text><rect x="430" y="175" width="320" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="590.0" y="199" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">reflect: walk @HeaderParam,</text><text x="590.0" y="219" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Method.invoke() per call</text><rect x="880" y="175" width="230" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="995.0" y="215.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Handler</text><line x1="300" y1="210" x2="430" y2="210" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><line x1="750" y1="210" x2="880" y2="210" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><text x="1130" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#B71C1C" text-anchor="start">every req</text><rect x="40" y="300" width="1220" height="200" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="64" y="330" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="start">Quarkus REST: a build step generates the binding code once</text><rect x="70" y="355" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="220.0" y="379" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">BUILD: processor reads</text><text x="220.0" y="399" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">@RestHeader / @RestQuery</text><line x1="370" y1="385" x2="470" y2="385" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="420.0" y="379.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">generates</text><rect x="470" y="355" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="620.0" y="379" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">bytecode:</text><text x="620.0" y="399" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">request.getHeader(...)</text><rect x="70" y="435" width="230" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="185.0" y="465.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Request</text><rect x="430" y="435" width="340" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="600.0" y="465.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">generated class (no reflection)</text><rect x="900" y="435" width="210" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1005.0" y="465.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Handler</text><line x1="300" y1="460" x2="430" y2="460" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><line x1="770" y1="460" x2="900" y2="460" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><rect x="830" y="360" width="110" height="22" rx="11" ry="11" fill="#006E6E"/><text x="885.0" y="375" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">fast start</text><rect x="960" y="360" width="120" height="22" rx="11" ry="11" fill="#006E6E"/><text x="1020.0" y="375" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">low memory</text><rect x="1100" y="360" width="130" height="22" rx="11" ry="11" fill="#006E6E"/><text x="1165.0" y="375" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">native-ready</text></svg>