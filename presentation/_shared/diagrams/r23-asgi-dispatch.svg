<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600"><defs><marker id="_arrow_svc_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0066CC"/></marker><marker id="_arrow_govern_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B36B00"/></marker></defs><rect x="0" y="0" width="1300" height="600" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">FastAPI / ASGI: where each handler actually runs</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One uvicorn process, one event loop: async def on the loop, plain def in a threadpool.</text><rect x="40" y="110" width="1220" height="430" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="64" y="142" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#4A4A4A" text-anchor="start">single uvicorn process</text><rect x="90" y="200" width="360" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="270.0" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">event loop (main thread)</text><text x="270.0" y="244" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">multiplexes many requests</text><text x="270.0" y="260" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">by yielding at each await</text><rect x="90" y="380" width="360" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="270.0" y="404" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">async def handler</text><text x="270.0" y="424" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">runs ON the loop</text><text x="270.0" y="440" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">await real I/O; cooperates</text><line x1="270" y1="380" x2="270" y2="320" stroke="#0066CC" stroke-width="1.6" marker-end="url(#_arrow_svc_0)"/><text x="270.0" y="344.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">scheduled on</text><rect x="840" y="200" width="370" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="1025.0" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">AnyIO threadpool</text><text x="1025.0" y="244" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">bounded worker threads</text><text x="1025.0" y="260" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">for blocking work</text><rect x="840" y="380" width="370" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="1025.0" y="404" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">plain def handler</text><text x="1025.0" y="424" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">offloaded via run_sync</text><text x="1025.0" y="440" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">may block its own thread</text><line x1="1025" y1="380" x2="1025" y2="320" stroke="#B36B00" stroke-width="1.6" marker-end="url(#_arrow_govern_0)"/><text x="1025.0" y="344.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">offloaded to</text><text x="650" y="300" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Starlette inspects the</text><text x="650" y="320" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">handler: coroutine or not?</text><text x="650" y="470" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#B71C1C" text-anchor="middle">GIL: blocking I/O releases it;</text><text x="650" y="488" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#B71C1C" text-anchor="middle">CPU-bound work does not.</text></svg>