<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600"><rect x="0" y="0" width="1300" height="600" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Pagination: offset vs keyset vs seek</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Pick by consistency under writes, depth cost, and coupling to the sort.</text><rect x="60" y="120" width="200" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="160.0" y="180.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Offset</text><rect x="290" y="120" width="640" height="50" rx="6" ry="6" fill="#151515"/><text x="302" y="142" font-family="Red Hat Mono, Menlo, monospace" font-size="11" fill="#E6E6E6">GET /bookings?limit=20&amp;offset=100</text><text x="290" y="206" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">Simple. Slow at depth; page drift when rows are inserted.</text><rect x="60" y="270" width="200" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="160.0" y="330.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Keyset</text><rect x="290" y="270" width="640" height="50" rx="6" ry="6" fill="#151515"/><text x="302" y="292" font-family="Red Hat Mono, Menlo, monospace" font-size="11" fill="#E6E6E6">GET /bookings?limit=20&amp;createdAt:lte=2026-10-11T00:00:00Z</text><text x="290" y="356" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">Consistent + fast. Couples paging to the sort key / filters.</text><rect x="60" y="420" width="200" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="160.0" y="480.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Seek</text><rect x="290" y="420" width="640" height="50" rx="6" ry="6" fill="#151515"/><text x="302" y="442" font-family="Red Hat Mono, Menlo, monospace" font-size="11" fill="#E6E6E6">GET /bookings?limit=20&amp;cursor=…   (opaque)</text><text x="290" y="506" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">Opaque cursor decouples paging from filters. More backend work.</text><rect x="970" y="120" width="270" height="410" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="994" y="152" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#EE0000" text-anchor="start">Always:</text><text x="994" y="190" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">• cap limit (DoS guard)</text><text x="994" y="224" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">• ship page metadata</text><text x="994" y="258" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">   (count, nextCursor)</text><text x="994" y="292" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">• sane defaults</text><text x="994" y="326" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">   (limit=20)</text><text x="994" y="360" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">• fields= for sparse</text><text x="994" y="394" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">   projections</text></svg>