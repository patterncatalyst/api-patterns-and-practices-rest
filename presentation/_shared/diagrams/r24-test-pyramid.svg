<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600"><rect x="0" y="0" width="1300" height="600" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The test pyramid: every layer checks one contract</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Many fast checks at the base, fewer slow ones on top (all against the shared schema).</text><rect x="140.0" y="440" width="720" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="500.0" y="480.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Contract: lint + schema validation</text><text x="890.0" y="480" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">fast · many · drift fails CI</text><rect x="220.0" y="360" width="560" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="500.0" y="400.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Integration: real Postgres &amp; Kafka</text><text x="810.0" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">@QuarkusTest · pytest + TestClient</text><rect x="300.0" y="280" width="400" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="500.0" y="320.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">API / E2E: shared Newman collection</text><text x="730.0" y="320" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">same assertions, both stacks</text><rect x="380.0" y="200" width="240" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="500.0" y="240.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Load: throughput under concurrency</text><text x="650.0" y="240" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">caps + async flow hold</text></svg>