<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1300" height="560" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Design around resources (nouns, not verbs)</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Collections and items, nested where it reads as ownership — never mirror the DB.</text><rect x="60" y="240" width="300" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="210.0" y="264" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">/bookings</text><text x="210.0" y="284" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">collection of bookings</text><rect x="500" y="160" width="320" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="660.0" y="184" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">/bookings/{id}</text><text x="660.0" y="204" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one booking (item)</text><rect x="500" y="320" width="320" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="660.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">/bookings/{id}/cargo</text><text x="660.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">cargo under a booking</text><line x1="360" y1="260" x2="500" y2="200" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="430.0" y="224.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">GET item</text><line x1="360" y1="300" x2="500" y2="360" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="430.0" y="324.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">sub-resource</text><rect x="880" y="150" width="360" height="300" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="904" y="184" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="start">Avoid</text><text x="904" y="218" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="start">·  /createBooking  (verb)</text><text x="904" y="248" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="start">·  mirroring table columns</text><text x="904" y="278" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="start">·  chatty API: many tiny GETs</text><text x="904" y="308" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="start">·  extraneous fetching</text><text x="904" y="358" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#006E6E" text-anchor="start">Do instead</text><text x="904" y="392" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006E6E" text-anchor="start">·  nouns + HTTP methods</text><text x="904" y="422" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#006E6E" text-anchor="start">·  links instead of deep nesting</text></svg>