<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560"><defs><marker id="_arrow_svc_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0066CC"/></marker><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker><marker id="_arrow_govern_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B36B00"/></marker></defs><rect x="0" y="0" width="1300" height="560" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">StreamingResponse &amp; BackgroundTasks on one loop</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Stream frames as they're yielded; defer work past the response — both on the event loop.</text><rect x="40" y="120" width="590" height="360" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="64" y="152" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066CC" text-anchor="start">StreamingResponse (SSE)</text><rect x="70" y="185" width="300" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="220.0" y="209" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">async generator</text><text x="220.0" y="229" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">await sleep; yield frame</text><line x1="370" y1="220" x2="470" y2="220" stroke="#0066CC" stroke-width="1.6" marker-end="url(#_arrow_svc_0)"/><rect x="470" y="185" width="130" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="535.0" y="209" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">socket</text><text x="535.0" y="229" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">flush now</text><text x="70" y="300" font-family="Red Hat Mono, Menlo, monospace" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">data: {...}\n\n   (t = 0.0s)</text><text x="70" y="330" font-family="Red Hat Mono, Menlo, monospace" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">data: {...}\n\n   (t = 0.25s)</text><text x="70" y="360" font-family="Red Hat Mono, Menlo, monospace" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="start">data: {...}\n\n   (t = 0.50s)</text><text x="70" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">each frame leaves as it is produced</text><rect x="670" y="120" width="590" height="360" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="694" y="152" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B36B00" text-anchor="start">BackgroundTasks (202 now, work later)</text><rect x="700" y="190" width="240" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="820.0" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">POST /notify</text><text x="820.0" y="234" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">add_task(...)</text><line x1="940" y1="225" x2="1050" y2="225" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="995.0" y="219.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">202 now</text><rect x="1050" y="190" width="180" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="1140.0" y="230.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">client</text><rect x="700" y="320" width="240" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B36B00" stroke-width="1.6"/><text x="820.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">deferred task</text><text x="820.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">runs after response</text><text x="820.0" y="380" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same event loop</text><line x1="820" y1="260" x2="820" y2="320" stroke="#B36B00" stroke-width="1.6" marker-end="url(#_arrow_govern_0)"/><text x="820.0" y="284.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">later turn</text><text x="700" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="start">202 Accepted is a promise: accepted, not yet done.</text></svg>