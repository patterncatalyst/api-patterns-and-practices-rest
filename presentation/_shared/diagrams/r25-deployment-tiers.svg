<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560"><defs><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker></defs><rect x="0" y="0" width="1300" height="560" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">One artifact across three tiers</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The same container image and the same contract, from laptop to cluster to OpenShift.</text><rect x="40" y="170" width="320" height="180" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="200.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Docker / Podman Compose</text><text x="200.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">app (Quarkus + FastAPI)</text><text x="200.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Postgres · Kafka</text><text x="200.0" y="246" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">+ LGTM tracing</text><rect x="490" y="170" width="320" height="180" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="650.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Kubernetes on minikube</text><text x="650.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Deployments · Services</text><text x="650.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Ingress</text><text x="650.0" y="246" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same image</text><rect x="940" y="170" width="320" height="180" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1100.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">OpenShift Local (CRC)</text><text x="1100.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Routes · BuildConfig</text><text x="1100.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">restricted-v2 SCC</text><text x="1100.0" y="246" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same image</text><line x1="360" y1="260" x2="490" y2="260" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="425.0" y="254.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">promote</text><line x1="810" y1="260" x2="940" y2="260" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="875.0" y="254.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">promote</text><rect x="40" y="400" width="1220" height="90" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="64" y="432" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">Examples run on plain infrastructure: Docker Engine on a Fedora / RHEL workstation,</text><text x="64" y="458" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">unchanged on minikube and on OpenShift Local. No managed cloud on