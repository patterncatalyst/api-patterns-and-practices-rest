<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 560" width="1300" height="560"><rect x="0" y="0" width="1300" height="560" fill="#FFFFFF"/><text x="650.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">HTTP methods: the safe / idempotent matrix</text><text x="650.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Safe = no state change. Idempotent = repeating the call lands the same state.</text><text x="70" y="205" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A4A4A" text-anchor="start">Safe?</text><text x="70" y="300" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A4A4A" text-anchor="start">Idempotent?</text><text x="70" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#5A5A5A" text-anchor="start">On /bookings</text><rect x="360" y="140" width="120" height="22" rx="11" ry="11" fill="#EE0000"/><text x="420.0" y="155" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">GET</text><rect x="360" y="190" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="420.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">YES</text><rect x="360" y="285" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="420.0" y="315.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">YES</text><text x="420" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Read a booking or</text><text x="420" y="416" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a page.</text><rect x="540" y="140" width="120" height="22" rx="11" ry="11" fill="#EE0000"/><text x="600.0" y="155" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">POST</text><rect x="540" y="190" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="600.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><rect x="540" y="285" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="600.0" y="315.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><text x="600" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Create; use Idempotency-Key</text><text x="600" y="416" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">to dedupe.</text><rect x="720" y="140" width="120" height="22" rx="11" ry="11" fill="#EE0000"/><text x="780.0" y="155" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">PUT</text><rect x="720" y="190" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="780.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><rect x="720" y="285" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="780.0" y="315.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">YES</text><text x="780" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Replace the whole</text><text x="780" y="416" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">booking.</text><rect x="900" y="140" width="120" height="22" rx="11" ry="11" fill="#EE0000"/><text x="960.0" y="155" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">PATCH</text><rect x="900" y="190" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="960.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><rect x="900" y="285" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="960.0" y="315.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><text x="960" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Partial update; idempotent only if</text><text x="960" y="416" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">you design it so.</text><rect x="1080" y="140" width="120" height="22" rx="11" ry="11" fill="#EE0000"/><text x="1140.0" y="155" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">DELETE</text><rect x="1080" y="190" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="1140.0" y="220.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">NO</text><rect x="1080" y="285" width="120" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1140.0" y="315.0" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">YES</text><text x="1140" y="400" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Cancel (soft-delete); repeat is</text><text x="1140" y="416" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="10" font-weight="normal" fill="#5A5A5A" text-anchor="middle">a no-op.</text><rect x="70" y="470" width="1160" height="60" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="94" y="505" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="start">PUT and DELETE are idempotent by HTTP contract; POST and PATCH are not. Make unsafe creates safe to retry with an Idempotency-Key (IETF draft).</text></svg>