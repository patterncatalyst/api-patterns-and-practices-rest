<text x="470.0" y="520" font-size="12" fill="#1d1d1d" text-anchor="middle">Route vs. Ingress: a Route is OpenShift&#x27;s own resource (host + TLS edge/passthrough/reencrypt on the Router); vanilla Kubernetes uses an Ingress against an Ingress controller instead; the two aren&#x27;t interchangeable.</text>
<text x="470.0" y="560" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">The cluster builds its own image from source via S2I and deploys it, with no external registry or CI push required to run on CRC.</text>
