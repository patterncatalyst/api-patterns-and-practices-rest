<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="320" y="20" width="260" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="450.0" y="50.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Booking (current state)</text>
<text x="450.0" y="67.5" font-size="11.5" fill="#555555" text-anchor="middle">status: pending</text>
<text x="450.0" y="82.5" font-size="11.5" fill="#555555" text-anchor="middle">notes: &quot;call on arrival&quot;</text>
<rect x="60" y="150" width="360" height="70" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="240.0" y="183.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">JSON Patch — RFC 6902</text>
<text x="240.0" y="200.0" font-size="11.5" fill="#dddddd" text-anchor="middle">Content-Type: application/json-patch+json</text>
<rect x="60" y="240" width="360" height="120" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="240.0" y="290.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">array of operations</text>
<text x="240.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">{&quot;op&quot;:&quot;replace&quot;,&quot;path&quot;:&quot;/status&quot;,&quot;value&quot;:&quot;confirmed&quot;}</text>
<text x="240.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">{&quot;op&quot;:&quot;remove&quot;,&quot;path&quot;:&quot;/notes&quot;}</text>
<rect x="480" y="150" width="360" height="70" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="660.0" y="183.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">JSON Merge Patch — RFC 7396</text>
<text x="660.0" y="200.0" font-size="11.5" fill="#dddddd" text-anchor="middle">Content-Type: application/merge-patch+json</text>
<rect x="480" y="240" width="360" height="120" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="660.0" y="290.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">partial object</text>
<text x="660.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">{&quot;status&quot;:&quot;confirmed&quot;,&quot;notes&quot;:null}</text>
<text x="660.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">null means &quot;delete this field&quot;</text>
<rect x="320" y="420" width="260" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="450.0" y="450.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Booking (updated)</text>
<text x="450.0" y="467.5" font-size="11.5" fill="#555555" text-anchor="middle">status: confirmed</text>
<text x="450.0" y="482.5" font-size="11.5" fill="#555555" text-anchor="middle">notes: removed</text>
<path d="M400,100 L240,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="326.0" y="119.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">PATCH (op list)</text>
<text x="326.0" y="119.0" font-size="11" fill="#555" text-anchor="middle">PATCH (op list)</text>
<path d="M500,100 L660,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="586.0" y="119.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">PATCH (partial obj)</text>
<text x="586.0" y="119.0" font-size="11" fill="#555" text-anchor="middle">PATCH (partial obj)</text>
<path d="M240,360 L400,420" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="326.0" y="384.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">apply ops in order</text>
<text x="326.0" y="384.0" font-size="11" fill="#555" text-anchor="middle">apply ops in order</text>
<path d="M660,360 L500,420" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="586.0" y="384.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">shallow-merge; null deletes</text>
<text x="586.0" y="384.0" font-size="11" fill="#555" text-anchor="middle">shallow-merge; null deletes</text>
<text x="450" y="525" font-size="11" fill="#1a1a1a" text-anchor="middle">JSON Patch: explicit, ordered operations — can target array elements and move/test fields.</text>
<text x="450" y="543" font-size="11" fill="#b8650a" text-anchor="middle">JSON Merge Patch: object-merge semantics only — simpler, but no array-element ops.</text>
</svg>