<text x="470.0" y="580" font-size="12" fill="#1d1d1d" text-anchor="middle">Logs and metrics ride the same OTLP pipeline into Loki and Mimir, but the trace path is what this chapter follows.</text>
<text x="470.0" y="615" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">One request, one trace: the app&#x27;s OTLP exporter hands spans to the collector, the collector forwards them to Tempo, and Grafana renders the stored trace back to you.</text>
