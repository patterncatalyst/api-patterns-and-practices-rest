<text x="490.0" y="53.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Client</text>
<text x="490.0" y="70.0" font-size="11.5" fill="#555555" text-anchor="middle">DELETE /bookings/{id}</text>
<rect x="330" y="130" width="320" height="100" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="490.0" y="163.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Soft delete (DELETE handler)</text>
<text x="490.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">status → CANCELLED</text>
<text x="490.0" y="195.0" font-size="11.5" fill="#555555" text-anchor="middle">write audit record</text>
<text x="490.0" y="210.0" font-size="11.5" fill="#555555" text-anchor="middle">excluded from default list queries</text>
<rect x="60" y="270" width="280" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="200.0" y="308.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /bookings (default)</text>
<text x="200.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">200 OK, not in results</text>
<rect x="400" y="270" width="280" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="540.0" y="300.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /bookings/{id}</text>
<text x="540.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">200 OK, status: CANCELLED</text>
<text x="540.0" y="332.5" font-size="11.5" fill="#555555" text-anchor="middle">still addressable for audit</text>
<rect x="700" y="270" width="260" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="830.0" y="308.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /bookings?includeCancelled=true</text>
<text x="830.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">200 OK, appears in results</text>
<rect x="330" y="410" width="320" height="90" rx="9" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
<text x="490.0" y="445.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Purge job (scheduled)</text>
<text x="490.0" y="462.5" font-size="11.5" fill="#dddddd" text-anchor="middle">runs under retention/compliance rule</text>
<text x="490.0" y="477.5" font-size="11.5" fill="#dddddd" text-anchor="middle">e.g. CANCELLED &gt; 90 days</text>
<rect x="360" y="540" width="260" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="490.0" y="578.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Hard delete</text>
<text x="490.0" y="595.0" font-size="11.5" fill="#555555" text-anchor="middle">row removed from storage</text>
<rect x="360" y="660" width="260" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="490.0" y="693.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /bookings/{id}</text>
<text x="490.0" y="710.0" font-size="11.5" fill="#555555" text-anchor="middle">404 Not Found</text>
