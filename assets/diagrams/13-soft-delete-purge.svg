<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="255" width="940" height="110" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="275" font-size="12" font-weight="700" fill="#1d1d1d">Soft delete — hidden by default, still addressable</text>
<rect x="290" y="385" width="440" height="335" rx="12" fill="#fff3e0" stroke="#ddd"/>
<text x="302" y="405" font-size="12" font-weight="700" fill="#1d1d1d">Purge — hard delete under retention rule</text>
