<path d="M490,500 L490,540" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="496.0" y="514.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">executes</text>
<text x="496.0" y="514.0" font-size="11" fill="#555" text-anchor="middle">executes</text>
<path d="M490,620 L490,660" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="496.0" y="634.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">row gone</text>
<text x="496.0" y="634.0" font-size="11" fill="#555" text-anchor="middle">row gone</text>
<text x="490" y="745" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">Soft delete preserves the audit trail and default-query hygiene; purge is the only step that actually removes data, and only under a retention rule.</text>
</svg>