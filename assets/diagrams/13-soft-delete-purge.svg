<text x="521.0" y="244.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">still 200 (audit)</text>
<text x="521.0" y="244.0" font-size="11" fill="#555" text-anchor="middle">still 200 (audit)</text>
